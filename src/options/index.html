<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strip Clickbait Settings</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: sans-serif;
    }

    main {
      max-width: 720px;
    }

    h1 {
      margin-top: 0;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    input,
    button {
      font: inherit;
      padding: 8px;
    }

    .checkbox-field {
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    hr {
      margin: 24px 0;
      border: none;
      border-top: 1px solid #ccc;
    }

    #cache-section h2 {
      margin-top: 0;
    }

    #status {
      min-height: 1.5em;
    }
  </style>
</head>

<body>
  <main>
    <h1>Strip Clickbait</h1>
    <p>Configure the extension. Settings are stored in browser local storage.</p>

    <form id="settings-form">
      <label class="field" for="openai-api-key">
        <span>OpenAI API Key</span>
        <input id="openai-api-key" name="openaiApiKey" type="password" autocomplete="off"
          placeholder="sk-…" />
      </label>

      <label class="field" for="openai-model">
        <span>OpenAI Model</span>
        <input id="openai-model" name="openaiModel" type="text" value="gpt-4o-mini" />
      </label>

      <label class="field checkbox-field" for="diagnostics">
        <input id="diagnostics" name="diagnosticsEnabled" type="checkbox" />
        <span>Enable diagnostic logging (browser console)</span>
      </label>

      <button type="submit">Save Settings</button>
    </form>

    <p id="status" aria-live="polite"></p>

    <hr />

    <section id="cache-section">
      <h2>Cache</h2>
      <p id="cache-count">Loading…</p>
      <button type="button" id="clear-cache">Clear all cached titles</button>
    </section>
  </main>

  <script src="index.js"></script>
</body>

</html>

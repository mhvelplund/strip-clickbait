<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strip Clickbait Settings</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: sans-serif;
    }

    main {
      max-width: 720px;
    }

    h1 {
      margin-top: 0;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    input,
    button {
      font: inherit;
      padding: 8px;
    }

    #status {
      min-height: 1.5em;
    }
  </style>
</head>

<body>
  <main>
    <h1>Strip Clickbait</h1>
    <p>Phase 1 scaffolding: configure extension settings for later phases.</p>

    <form id="settings-form">
      <label class="field" for="openai-api-key">
        <span>OpenAI API Key</span>
        <input id="openai-api-key" name="openaiApiKey" type="password" autocomplete="off" />
      </label>

      <label class="field" for="openai-model">
        <span>OpenAI Model</span>
        <input id="openai-model" name="openaiModel" type="text" value="gpt-4o-mini" />
      </label>

      <button type="submit">Save Settings</button>
    </form>

    <p id="status" aria-live="polite"></p>
  </main>

  <script src="index.js"></script>
</body>

</html>

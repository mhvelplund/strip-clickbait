[tools]
gh = "latest"
node = "lts"

[shell_alias]
gs = "gh stack"

[tasks.build]
description = "Build a distribution zip for upload to Firefox Add-ons (AMO)"
dir = "{{ config_root }}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=$(sed -nE 's/.*"version" *: *"([^"]+)".*/\1/p' manifest.json | head -1)
out="dist/strip-clickbait-${version}.zip"
mkdir -p dist
rm -f "$out"
# manifest.json must be at the zip root for AMO. Include only the files the
# extension actually loads — manifest, source, and icons.
zip -r -FS "$out" manifest.json src icons -x '*.DS_Store'
echo "Built ${out}"
'''
